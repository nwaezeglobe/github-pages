<script>
const firebaseConfig = {
    apiKey: "AIzaSyBnOZ8YeEi27mckQDBl6OIqrZcDgYqEKN4",
    authDomain: "nwaezehaircutz",
    projectId: "nwaezehaircutz",
    storageBucket: "nwaezehaircutz.appspot.com",
    messagingSenderId: "781080215132",
    appId: "1:781080215132:web:728b77b3247b7d2a9df099"
  };
  
  // Firebase config (replace with yours)
  const firebaseConfig = {
    apiKey: "AIzaSyBnOZ8YeEi27mckQDBl6OIqrZcDgYqEKN4",
    authDomain: "nwaezehaircutz",
    projectId: "nwaezehaircutz",
    storageBucket: "nwaezehaircutz.appspot.com",
    messagingSenderId: "781080215132",
    appId: "1:781080215132:web:728b77b3247b7d2a9df099"
  };
  
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const storage = firebase.storage();

  // Tab Switcher
  function switchTab(tabId) {
    document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
  }

  // Login / Signup
  function loginUser() {
    const email = document.getElementById("email").value;
    const pass = document.getElementById("password").value;
    auth.signInWithEmailAndPassword(email, pass)
      .then(() => {
        alert("Logged in!");
        switchTab("uploadTab"); // redirect after login
      }).catch(err => alert(err.message));
  }

  function signupUser() {
    const email = document.getElementById("email").value;
    const pass = document.getElementById("password").value;
    auth.createUserWithEmailAndPassword(email, pass)
      .then(() => {
        alert("Account created!");
        switchTab("uploadTab"); // redirect after signup
      }).catch(err => alert(err.message));
  }

  // Upload Image
  function uploadImage() {
    const file = document.getElementById("uploadFile").files[0];
    const user = auth.currentUser;
    if (!user) return alert("Login first.");

    const path = `uploads/${user.uid}/${file.name}`;
    const ref = storage.ref(path);
    ref.put(file).then(snapshot => snapshot.ref.getDownloadURL())
      .then(url => {
        document.getElementById("uploadMsg").innerText = "Upload complete!";
        document.getElementById("previewImage").src = url;
      })
      .catch(err => alert(err.message));
  }

  // Admin View (list all uploads)
  function listAllImages() {
    const ref = storage.ref("uploads/");
    ref.listAll().then(result => {
      let gallery = "";
      result.prefixes.forEach(folderRef => {
        folderRef.listAll().then(files => {
          files.items.forEach(fileRef => {
            fileRef.getDownloadURL().then(url => {
              gallery += `<div style="margin:10px;">
                  <img src="${url}" style="max-width:100px;"><br>
                  <small>${fileRef.fullPath}</small><br>
                  <a href="${url}" target="_blank">View</a>
                </div>`;
              document.getElementById("adminGallery").innerHTML = gallery;
            });
          });
        });
      });
    });
  }

  // Auto-load admin tab
  document.getElementById("adminTab").addEventListener("click", listAllImages);
</script>

<script>
